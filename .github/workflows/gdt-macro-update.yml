# Goh Dip Tong — macro series update
#
# Collects only the macro series registered in the model registry, retaining the
# release vintage so a revised observation is a new row rather than an
# overwrite of what we previously believed.
#
# COMMIT POLICY (Stage 1 spec section 1.9)
# This workflow never pushes to the default branch. Generated changes land on a
# dedicated gdt/auto/macro-* branch and merge is manual.
#
# WRITE MODE
#   scheduled run   -> commit   (promote validated output; a PR is the only way out)
#   manual dispatch -> operator's choice, defaulting to validate_only
#
# Schedule source of truth: config/goh-dip-tong/schedules.yml
name: gdt-macro-update

on:
  workflow_dispatch:
    inputs:
      write_mode:
        description: "validate_only collects and validates but promotes nothing"
        type: choice
        options: [validate_only, commit]
        default: validate_only
      provider:
        description: "Force a provider id from sources.yml (optional)"
        type: string
        required: false
  schedule:
    # Mon 06:40 WIB — weekly; these series are monthly at best.
    - cron: "40 23 * * 0"

permissions:
  contents: read

concurrency:
  group: gdt-macro-update
  cancel-in-progress: false

jobs:
  macro-update:
    runs-on: ubuntu-latest
    # Scheduled runs do nothing until GDT_SCHEDULES_ENABLED is deliberately set
    # to 'true'. Manual dispatch is never gated.
    if: github.event_name != 'schedule' || vars.GDT_SCHEDULES_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: python -m pip install --quiet -r pipeline/goh_dip_tong/requirements.txt

      - name: Show source status and rights
        run: python -m pipeline.goh_dip_tong.cli sources

      - name: Collect registered macro series
        run: |
          python -m pipeline.goh_dip_tong.cli macro-update \
            --write-mode "${{ inputs.write_mode || 'commit' }}" \
            ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }}

      - name: Repository-data guard
        run: python -m pipeline.goh_dip_tong.cli repo-guard

      - name: Detect generated changes
        id: diff
        run: |
          if git diff --quiet -- config/goh-dip-tong data/goh-dip-tong; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data change — exiting successfully without committing."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- config/goh-dip-tong data/goh-dip-tong
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="gdt/auto/macro-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Staging is restricted to generated paths. Nothing else can ride along.
          git add config/goh-dip-tong data/goh-dip-tong
          git commit -m "data(gdt): update macro-series through $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          cat > /tmp/gdt-pr-body.md <<'EOF'
          Automated update generated by `gdt-macro-update`.

          Generated data only: `config/goh-dip-tong/` and `data/goh-dip-tong/`.
          Review the data diff and the attached quality report before merging.
          EOF
          gh pr create \
            --title "data(gdt): macro series update $(date -u +%Y-%m-%d)" \
            --body-file /tmp/gdt-pr-body.md \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdt-macro-update-quality
          path: data/goh-dip-tong/quality/latest/
          if-no-files-found: ignore
