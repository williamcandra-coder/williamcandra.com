# Goh Dip Tong — data quality gate
#
# Runs on every pull request that touches the pipeline or its data, on a daily
# schedule, and on demand. This workflow is READ-ONLY: it has no write
# permission and never commits. Its job is to say whether what is already
# committed is sound, and to block a generated-data pull request that is not.
#
# Checks (Stage 1 spec section 1.8):
#   - every schema in schemas/goh-dip-tong/ is a valid Draft 2020-12 schema
#   - idx30.current.json validates against its schema
#   - the active constituent count is checked against the count the SOURCE
#     declared, never against a hard-coded 30
#   - ticker uniqueness, effective date ranges, entry dates within range
#   - category to model-family mapping, and the ONBOARDING rule
#   - source staleness
#   - missing-versus-zero across every committed dataset
#   - declared data rights match docs/goh-dip-tong/SOURCE_REGISTER.md
#   - the generated config still satisfies the Stage 3 UI contract
#   - the repository-data guard
#   - the full Stage 1 unit-test suite
#   - the Stage 1 acceptance script (all 17 requirements)
#   - the Stage 2 engine unit-test suite
#   - the Stage 2 acceptance script
#   - the Stage 3 UI test suite (Node's built-in runner; no package manager)
name: gdt-data-quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pipeline/**"
      - "engine/**"
      - "config/goh-dip-tong/**"
      - "data/goh-dip-tong/**"
      - "schemas/goh-dip-tong/**"
      - ".github/workflows/gdt-*.yml"
  schedule:
    # 13:05 WIB daily — an independent audit of what is committed.
    - cron: "5 6 * * *"

# Read-only. This workflow must never be able to write to the repository.
permissions:
  contents: read

concurrency:
  group: gdt-data-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: python -m pip install --quiet -r pipeline/goh_dip_tong/requirements.txt

      - name: Source status and rights consistency
        run: python -m pipeline.goh_dip_tong.cli sources

      - name: Stage 1 unit-test suite
        run: python -m pytest pipeline/goh_dip_tong/tests -q

      - name: Stage 1 acceptance test
        # Verifies all 17 Stage 1 acceptance requirements. Every write it
        # performs goes to a throwaway sandbox under $(mktemp -d); its own
        # closing self-check fails the build if the repository tree moved.
        # Exits non-zero if any single check fails.
        run: ./pipeline/goh_dip_tong/tests/acceptance.sh

      - name: Stage 2 engine unit-test suite
        # The engine imports the pipeline and needs no extra dependencies, so
        # the install step above already covers it.
        run: python -m pytest engine/goh_dip_tong/tests -q

      - name: Stage 2 acceptance test
        # Same isolation contract as Stage 1's: sandboxed writes, a closing
        # self-check on the repository tree, non-zero exit on any failure.
        run: ./engine/goh_dip_tong/tests/acceptance_stage2.sh

      - name: Stage 3 UI test suite
        run: node --test tests/goh-dip-tong-ui.test.js

      - name: Data-quality audit
        run: python -m pipeline.goh_dip_tong.cli quality --verbose

      - name: Repository-data guard
        run: python -m pipeline.goh_dip_tong.cli repo-guard --verbose

      - name: Assert the audit had no side effects
        run: |
          # The acceptance script is sandboxed and leaves nothing behind. The
          # `quality` command legitimately writes its own report under
          # data/goh-dip-tong/quality/ — uploaded as an artifact, never
          # committed (this job has no write permission and no commit step).
          # Anything changing OUTSIDE that directory means some command has a
          # side effect it should not have, which is worth failing the build over.
          if ! git diff --quiet -- . ':(exclude)data/goh-dip-tong/quality'; then
            echo "::error::the quality audit modified tracked files outside its own report"
            git --no-pager diff --stat -- . ':(exclude)data/goh-dip-tong/quality'
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- \
                     . ':(exclude)data/goh-dip-tong/quality')" ]; then
            echo "::error::the run left untracked files behind"
            git status --porcelain --untracked-files=all -- \
              . ':(exclude)data/goh-dip-tong/quality'
            exit 1
          fi
          echo "No side effects outside the audit's own quality report."

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdt-data-quality-reports
          path: data/goh-dip-tong/quality/latest/
          if-no-files-found: ignore
