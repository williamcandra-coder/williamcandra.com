# Goh Dip Tong — Bank Indonesia endpoint discovery
#
# PHASE A OF THE BI VERTICAL SLICE. DIAGNOSTIC ONLY. MANUAL ONLY. READ-ONLY.
#
# Answers one question: for a short list of *documented official* Bank Indonesia
# pages, what does the server actually return — final URL after redirects, HTTP
# status, content type, size, and cache validators? That is the evidence needed
# before anyone writes a parser or claims a publication frequency.
#
# WHAT THIS WORKFLOW DOES NOT DO
#   - it does not enable any provider, whatever the results say;
#   - it does not implement or run a parser;
#   - it does not collect, normalize or store any series data;
#   - it does not read or write config/goh-dip-tong/ or data/goh-dip-tong/;
#   - it does not commit, push, open a pull request or merge;
#   - it has no schedule and cannot fire on its own;
#   - it uses no secrets;
#   - it never bypasses authentication, rate limiting or bot protection —
#     a 401 or 403 is recorded as the answer and the probe moves on.
#
# NO RESPONSE BODY IS EVER READ, STORED OR PRINTED.
# Every request is a HEAD. If a server rejects HEAD (405/501) the fallback GET
# is opened and closed without reading a single byte of the payload. Size comes
# from the Content-Length header, never from measuring content.
#
# REDIRECTS ARE FOLLOWED MANUALLY AND BOUNDED.
# Automatic redirect handling is disabled so that *every hop* is recorded —
# BI serves .aspx landing pages behind redirects, and which URL finally answers
# is the whole point. Maximum 5 hops, then the chain is reported as truncated.
#
# A DOCUMENTED PAGE IS NOT A DATASET, AND REACHABILITY IS NOT PERMISSION.
# The best outcome here is "an official URL responded and here is its shape".
# Enabling bank_indonesia remains a separate human decision requiring a dated
# rights review in docs/goh-dip-tong/SOURCE_REGISTER.md.
name: gdt-bi-discovery

# Manual only. There is deliberately no `schedule:` key.
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Newline- or comma-separated official URLs to probe"
        type: string
        required: false
        default: ""
      timeout_seconds:
        description: "Per-request timeout"
        type: string
        default: "20"
      delay_seconds:
        description: "Pause between candidates; keep this conservative"
        type: string
        default: "3"
      max_redirects:
        description: "Maximum redirect hops to follow per candidate"
        type: string
        default: "5"

# Read-only. No write access and no commit step, so it cannot alter the
# repository even if something went wrong.
permissions:
  contents: read

concurrency:
  group: gdt-bi-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe documented Bank Indonesia URLs
        env:
          GDT_CANDIDATES: ${{ inputs.candidates }}
          GDT_TIMEOUT: ${{ inputs.timeout_seconds || '20' }}
          GDT_DELAY: ${{ inputs.delay_seconds || '3' }}
          GDT_MAX_REDIRECTS: ${{ inputs.max_redirects || '5' }}
          GDT_OUTPUT: ${{ runner.temp }}/bi-discovery-report.json
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/probe.py" <<'PY'
          """Bank Indonesia endpoint discovery — metadata only, no bodies.

          Standard library only, so this workflow needs no dependency install
          and cannot be affected by a package resolution changing under it.
          """
          import json, os, ssl, sys, time, urllib.error, urllib.request

          # Documented official candidates. Landing/index pages are included
          # only to record where they redirect to; none of them is scraped.
          DEFAULT_CANDIDATES = [
              "https://www.bi.go.id/en/statistik/indikator/bi-rate.aspx",
              "https://www.bi.go.id/en/statistik/ekonomi-keuangan/seki/default.aspx",
              "https://www.bi.go.id/en/statistik/ekonomi-keuangan/seki/Pages/SEKI-JUNI-2026.aspx",
              "https://www.bi.go.id/id/statistik/Metadata/SEKI/default.aspx",
          ]

          UA = "goh-dip-tong-discovery/1.0 (+https://williamcandra.com)"
          TIMEOUT = float(os.environ.get("GDT_TIMEOUT") or 20)
          DELAY = float(os.environ.get("GDT_DELAY") or 3)
          MAX_HOPS = int(os.environ.get("GDT_MAX_REDIRECTS") or 5)

          raw = (os.environ.get("GDT_CANDIDATES") or "").replace(",", "\n")
          CANDIDATES = [u.strip() for u in raw.splitlines() if u.strip()] or DEFAULT_CANDIDATES

          # Captured header fields. Nothing else is retained from a response.
          KEEP = ("content-type", "content-length", "last-modified", "etag",
                  "content-disposition")


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """Disable automatic redirects so every hop is visible."""
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          OPENER = urllib.request.build_opener(
              NoRedirect, urllib.request.HTTPSHandler(context=ssl.create_default_context())
          )


          def head(url, method="HEAD"):
              """One request. Returns (status, headers) — never a body."""
              req = urllib.request.Request(
                  url, method=method, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  resp = OPENER.open(req, timeout=TIMEOUT)
                  try:
                      # Deliberately no resp.read(): the payload is never touched.
                      return resp.status, {k.lower(): v for k, v in resp.headers.items()}
                  finally:
                      resp.close()
              except urllib.error.HTTPError as exc:
                  headers = {k.lower(): v for k, v in (exc.headers or {}).items()}
                  try:
                      exc.close()
                  except Exception:
                      pass
                  return exc.code, headers


          def classify(status, headers):
              ctype = (headers.get("content-type") or "").split(";")[0].strip().lower()
              if status == 401:
                  return "AUTHENTICATION_REQUIRED"
              if status in (403, 429, 451):
                  return "ACCESS_CONTROLLED"
              if 500 <= status <= 599:
                  return "NETWORK_ERROR"
              if 200 <= status <= 299:
                  # A .aspx page is a document, not a dataset. Recorded honestly.
                  if ctype in ("application/json", "text/csv", "application/xml",
                               "text/xml", "application/vnd.ms-excel",
                               "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"):
                      return "MACHINE_CONSUMABLE_CANDIDATE"
                  if ctype in ("text/html", "application/xhtml+xml"):
                      return "HTML_DOCUMENT_NOT_A_DATASET"
                  return "CONTENT_TYPE_UNEXPECTED"
              return "NETWORK_ERROR"


          def probe(url):
              record = {
                  "requestedUrl": url, "checkedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "hops": [], "finalUrl": None, "httpStatus": None, "contentType": None,
                  "contentLength": None, "lastModified": None, "etag": None,
                  "contentDisposition": None, "redirectChainTruncated": False,
                  "outcome": "NOT_TESTED", "detail": None,
                  # Restated per record so it cannot be read out of context.
                  "enablesProvider": False, "bodyRetained": False,
              }
              current, method = url, "HEAD"
              try:
                  for hop in range(MAX_HOPS + 1):
                      status, headers = head(current, method)
                      if status in (405, 501) and method == "HEAD":
                          # Server refuses HEAD. Retry once with GET; the body is
                          # still never read.
                          method = "GET"
                          status, headers = head(current, method)
                      record["hops"].append({
                          "url": current, "method": method, "status": status,
                          "location": headers.get("location"),
                          "contentType": headers.get("content-type"),
                      })
                      if 300 <= status <= 399 and headers.get("location"):
                          if hop == MAX_HOPS:
                              record["redirectChainTruncated"] = True
                              record["detail"] = f"more than {MAX_HOPS} redirects"
                              break
                          current = urllib.request.urljoin(current, headers["location"])
                          method = "HEAD"
                          continue
                      record["finalUrl"] = current
                      record["httpStatus"] = status
                      record["contentType"] = headers.get("content-type")
                      record["lastModified"] = headers.get("last-modified")
                      record["etag"] = headers.get("etag")
                      record["contentDisposition"] = headers.get("content-disposition")
                      length = headers.get("content-length")
                      if length is not None:
                          try:
                              record["contentLength"] = int(length)
                          except (TypeError, ValueError):
                              record["contentLength"] = None
                      record["outcome"] = classify(status, headers)
                      record["detail"] = record["detail"] or f"responded {status}"
                      break
              except Exception as exc:  # noqa: BLE001 - every failure is a finding
                  name = type(exc).__name__
                  unreachable = ("URLError", "timeout", "TimeoutError", "socket.timeout",
                                 "ConnectionResetError", "ConnectionRefusedError")
                  record["outcome"] = ("UNREACHABLE_FROM_GITHUB_ACTIONS"
                                       if name in unreachable else "NETWORK_ERROR")
                  record["detail"] = name
              return record


          results = []
          for i, url in enumerate(CANDIDATES):
              if i:
                  time.sleep(DELAY)      # one request at a time, never a burst
              results.append(probe(url))

          report = {
              "schemaVersion": "1.0.0",
              "report": "bank-indonesia-endpoint-discovery",
              "generatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "provider": "bank_indonesia",
              "notice": (
                  "PHASE A DIAGNOSTIC ONLY. Reachability is not permission and a "
                  "documented page is not a dataset. No provider is enabled by this "
                  "report, no parser was implemented, and no response body was read "
                  "or stored. Enabling bank_indonesia requires a dated rights review "
                  "in docs/goh-dip-tong/SOURCE_REGISTER.md."
              ),
              "bodiesRetained": False,
              "providersEnabledByThisRun": 0,
              "maxRedirects": MAX_HOPS,
              "counts": {
                  "probed": len(results),
                  "machineConsumableCandidates": sum(
                      1 for r in results if r["outcome"] == "MACHINE_CONSUMABLE_CANDIDATE"),
                  "htmlDocuments": sum(
                      1 for r in results if r["outcome"] == "HTML_DOCUMENT_NOT_A_DATASET"),
                  "accessControlled": sum(
                      1 for r in results if r["outcome"] == "ACCESS_CONTROLLED"),
              },
              "results": results,
          }

          out = os.environ["GDT_OUTPUT"]
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True, ensure_ascii=False)
              fh.write("\n")

          print("[gdt-bi-discovery]  PHASE A DIAGNOSTIC ONLY")
          print("  Reachability is not permission. A documented page is not a dataset.")
          print("  No provider enabled. No parser implemented. No body retained.")
          print()
          for r in results:
              print(f"  {r['requestedUrl']}")
              for h in r["hops"]:
                  loc = f"  -> {h['location']}" if h.get("location") else ""
                  print(f"      hop {h['method']:<4} {h['status']}{loc}")
              print(f"      final:    {r['finalUrl']}")
              print(f"      status:   {r['httpStatus']}   type: {r['contentType']}")
              print(f"      length:   {r['contentLength']}   last-modified: {r['lastModified']}")
              print(f"      etag:     {r['etag']}")
              if r["contentDisposition"]:
                  print(f"      filename: {r['contentDisposition']}")
              print(f"      OUTCOME:  {r['outcome']}  ({r['detail']})")
              print()
          print(f"  counts: {report['counts']}")
          print(f"  providers enabled by this run: {report['providersEnabledByThisRun']}")
          print(f"  response bodies retained: {report['bodiesRetained']}")
          print(f"  report written: {out}")
          PY
          python "${RUNNER_TEMP}/probe.py"

      - name: Assert nothing was enabled or modified
        run: |
          set -euo pipefail
          # The report is written to RUNNER_TEMP, outside the working tree, so a
          # diagnostic artifact can never end up in a commit.
          if ! git diff --quiet; then
            echo "::error::the discovery probe modified tracked files"
            git --no-pager diff --stat
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::the discovery probe left files behind"
            git status --porcelain --untracked-files=all
            exit 1
          fi
          # bank_indonesia must still be disabled. Checked without a YAML parser
          # so this step needs no dependency install.
          if git grep -q "^  bank_indonesia:" -- config/goh-dip-tong/sources.yml; then
            BLOCK=$(sed -n '/^  bank_indonesia:/,/^  [a-z_]*:$/p' config/goh-dip-tong/sources.yml)
            if ! echo "$BLOCK" | grep -q "enabled: false"; then
              echo "::error::bank_indonesia is no longer disabled"
              exit 1
            fi
            if ! echo "$BLOCK" | grep -q "rights_status: MANUAL_REVIEW_REQUIRED"; then
              echo "::error::bank_indonesia rights_status changed"
              exit 1
            fi
            echo "bank_indonesia still enabled:false / MANUAL_REVIEW_REQUIRED."
          fi
          echo "Working tree clean; no provider enabled; no parser implemented."

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdt-bi-discovery-report
          path: ${{ runner.temp }}/bi-discovery-report.json
          if-no-files-found: warn
          retention-days: 30
