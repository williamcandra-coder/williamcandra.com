# Goh Dip Tong Stage 2 — scenario definitions
#
# Scenarios are offsets applied to the historical anchors, never to the output.
# Moving the valuation directly would be a guess dressed as a scenario; moving a
# driver states which assumption differs and lets the mathematics carry it
# through.
#
# SIGN DISCIPLINE
# Each offset is signed so that BULL is the favourable direction for value and
# BEAR the unfavourable one. That is what makes `bear <= base <= bull` a
# meaningful assertion rather than an accident of which way a number happened to
# be written. A driver whose effect on value is not monotone must not be listed
# here — it would silently break the ordering guarantee.
#
#   earning_asset_growth  higher growth  -> higher value   (while ROE > r)
#   asset_yield           higher yield   -> higher value
#   funding_cost          higher cost    -> LOWER value    (offsets inverted)
#   cost_of_credit        higher cost    -> LOWER value    (offsets inverted)
#   cost_to_income        higher cost    -> LOWER value    (offsets inverted)

schemaVersion: "1.0.0"

# Order is pinned. Scenario iteration follows this list, never dict order, so
# output ordering cannot drift between runs.
order: [BEAR, BASE, BULL]

# Absolute offsets in ratio units (0.01 = 100 bps).
offsets:
  earning_asset_growth:
    BEAR: -0.020
    BASE: 0.0
    BULL: +0.020
  asset_yield:
    BEAR: -0.005
    BASE: 0.0
    BULL: +0.005
  funding_cost:
    BEAR: +0.004
    BASE: 0.0
    BULL: -0.004
  cost_of_credit:
    BEAR: +0.006
    BASE: 0.0
    BULL: -0.003
  cost_to_income:
    BEAR: +0.030
    BASE: 0.0
    BULL: -0.030

# Drivers whose offsets are inverted relative to value, recorded explicitly so
# the monotonicity test can assert the sign discipline rather than assume it.
inverted_drivers: [funding_cost, cost_of_credit, cost_to_income]

# Floors and caps. A scenario must not push an anchor somewhere it cannot be:
# a negative funding cost or a cost-to-income ratio above 1 is not a bear case,
# it is a broken assumption.
bounds:
  earning_asset_growth: [-0.20, 0.40]
  asset_yield: [0.0, 0.40]
  funding_cost: [0.0, 0.30]
  cost_of_credit: [0.0, 0.20]
  cost_to_income: [0.05, 1.20]
  payout: [0.0, 1.0]
  tax_rate: [0.0, 0.60]
