# Goh Dip Tong — repository-data guard thresholds
#
# The guard runs before any generated data is committed (spec section 1.2). If
# it fails, generated changes are NOT committed. Thresholds live here rather
# than in code so raising one is a visible, reviewable diff.

schemaVersion: "1.0.0"

# Paths the guard is responsible for. Anything outside these is not the
# pipeline's business and is ignored.
guarded_paths:
  - "config/goh-dip-tong"
  - "data/goh-dip-tong"

limits:
  # A single generated file larger than this is almost always a mistake
  # (a full PDF, an unfiltered dump, a committed archive).
  max_file_bytes: 2097152          # 2 MiB
  # Total added bytes across one generated-data change set.
  max_total_change_bytes: 20971520 # 20 MiB
  # A run that rewrites more files than this is suspicious - most likely a
  # formatting or ordering regression rather than real new data.
  max_changed_files: 500
  # Fraction of rows in a dataset that may be exact duplicates of another row.
  max_duplicate_row_ratio: 0.02
  # A schema may gain fields over time, but not explode in one commit.
  max_new_fields_per_dataset: 12
  # JSONL / CSV files longer than this should be partitioned instead.
  max_rows_per_file: 250000

# Extensions that must never appear under guarded paths. Binary blobs and
# archives belong behind a manifest, not in git.
forbidden_extensions:
  - .pdf
  - .zip
  - .gz
  - .tar
  - .7z
  - .rar
  - .xlsx
  - .xls
  - .doc
  - .docx
  - .exe
  - .dll
  - .so
  - .dylib
  - .pkl
  - .pickle
  - .db
  - .sqlite

# Content types a data file is allowed to be. Anything else fails the guard.
allowed_extensions:
  - .json
  - .jsonl
  - .csv
  - .yml
  - .yaml
  - .md
  - .txt
  - .gitkeep

# Parquet is permitted by the spec "only if repeated versioning remains
# repository-safe". It is off until someone measures that.
parquet:
  allowed: false
  max_file_bytes: 524288
  reason: "Binary format; repeated versioning cost not yet measured. Revisit in Stage 2."

# A file whose first non-whitespace bytes look like markup is a saved error
# page, not data. This is the single most common silent-corruption mode for
# scraped sources.
html_error_page_markers:
  - "<!doctype html"
  - "<html"
  - "<HTML"
  - "<?xml-stylesheet"
  - "<head>"
  - "Access Denied"
  - "403 Forbidden"
  - "404 Not Found"
  - "Just a moment..."
  - "Enable JavaScript and cookies to continue"

# Secret-shaped strings. Any hit fails the guard outright — there is no
# threshold and no allowlist. Patterns are Python regular expressions.
secret_patterns:
  - name: aws_access_key_id
    pattern: "AKIA[0-9A-Z]{16}"
  - name: github_token
    pattern: "gh[pousr]_[A-Za-z0-9]{36,}"
  - name: github_fine_grained_pat
    pattern: "github_pat_[A-Za-z0-9_]{60,}"
  - name: google_api_key
    pattern: "AIza[0-9A-Za-z_-]{35}"
  - name: slack_token
    pattern: "xox[abprs]-[0-9A-Za-z-]{10,}"
  - name: private_key_block
    pattern: "-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----"
  - name: generic_bearer
    pattern: "(?i)\\b(authorization|bearer)\\s*[:=]\\s*['\\\"]?[A-Za-z0-9._-]{20,}"
  - name: generic_assigned_secret
    pattern: "(?i)\\b(api[_-]?key|secret|passwd|password|token)\\s*[:=]\\s*['\\\"][^'\\\"]{12,}['\\\"]"

# Values a numeric data column must never silently contain. These are the
# signatures of a failed extraction that was coerced into a number.
suspicious_numeric_sentinels:
  - -999999999
  - 999999999
  - -1e308
  - 1e308
