# Goh Dip Tong — reviewed source policy
#
# This file is the single runtime authority on WHICH sources may run and WHAT
# may be done with the data they return. The pipeline refuses to collect from a
# provider that is not listed here, and refuses to write a record to a public
# (git-tracked) path unless this file grants the matching right.
#
# Editing a `rights` block here is a rights decision, not a code change. Every
# `true` must be backed by a documented, dated review row in
# docs/goh-dip-tong/SOURCE_REGISTER.md. The rights gate cross-checks the two
# files and fails closed when they disagree.
#
# Allowed values for `rights_status` (Stage 1 spec section 1.6):
#   PUBLIC_RAW_DATA_APPROVED       raw records may be committed and shown
#   PUBLIC_DERIVED_OUTPUT_APPROVED only derived/normalized output may be public
#   PUBLIC_METADATA_ONLY           only metadata (ids, urls, titles, dates)
#   PRIVATE_RESEARCH_ONLY          never committed to git, never displayed
#   DISCOVERY_ONLY                 may be listed/linked, never fetched in bulk
#   MANUAL_REVIEW_REQUIRED         unresolved — provider must stay disabled
#   DISABLED                       administratively off

schemaVersion: "1.0.0"
reviewedAt: "2026-07-30"
reviewedBy: "repository owner (pending counter-signature)"

defaults:
  timeout_seconds: 20
  max_retries: 3
  retry_backoff_seconds: 2.0
  user_agent: "goh-dip-tong-collector/1.0 (+https://williamcandra.com)"
  # A provider must never be granted more than these ceilings, whatever it asks
  # for. Raising a ceiling is a policy change and requires a SOURCE_REGISTER row.
  ceilings:
    requests_per_minute: 30
    max_payload_bytes: 26214400 # 25 MiB

providers:

  # ---------------------------------------------------------------------------
  # FIXTURE PROVIDERS — committed, offline, deterministic.
  # These exist so the whole pipeline is exercisable and testable without any
  # network access and without asserting rights nobody has reviewed.
  # ---------------------------------------------------------------------------

  fixture_idx30_registry:
    kind: fixture
    enabled: true
    operator: "This repository (development fixture)"
    data_types: [index_membership, company_identity, sector_classification]
    fixture_path: "pipeline/goh_dip_tong/tests/fixtures/idx30/2026H1.json"
    authoritative: false
    rights_status: PUBLIC_METADATA_ONLY
    rights:
      store_raw: true
      commit_to_repo: true
      public_display: true
      redistribute: false
    attribution: "Development fixture — not IDX data, not an authoritative constituent list."
    update_cadence: manual
    notes: >
      Ticker symbols, legal names and IDX-IC sector labels are factual identity
      metadata authored in-repo for development. This is NOT a retrieved IDX
      publication and must never be presented as the live IDX30 universe. Every
      artefact generated from it carries provenance=FIXTURE, authoritative=false.

  fixture_market_prices:
    kind: fixture
    enabled: true
    operator: "This repository (development fixture)"
    data_types: [market_prices_daily, corporate_actions]
    fixture_path: "pipeline/goh_dip_tong/tests/fixtures/market-prices/daily-sample.csv"
    authoritative: false
    # Deliberately the most restrictive useful status. Price series are the one
    # data type where redistribution rights are genuinely unresolved, so the
    # fixture is held to the same standard the live provider will be held to.
    rights_status: PRIVATE_RESEARCH_ONLY
    rights:
      store_raw: true
      commit_to_repo: false
      public_display: false
      redistribute: false
    attribution: null
    update_cadence: manual
    notes: >
      Writes land under data/goh-dip-tong/_private/ which is git-ignored. This
      keeps the daily-update path fully exercisable while guaranteeing no price
      series can be committed before market-data rights are documented.

  fixture_disclosures:
    kind: fixture
    enabled: true
    operator: "This repository (development fixture)"
    data_types: [disclosure_metadata, events]
    fixture_path: "pipeline/goh_dip_tong/tests/fixtures/disclosures/metadata-sample.json"
    authoritative: false
    rights_status: PUBLIC_METADATA_ONLY
    rights:
      store_raw: false
      commit_to_repo: true
      public_display: true
      redistribute: false
    attribution: "Development fixture — synthetic disclosure metadata."
    update_cadence: manual
    notes: >
      Metadata only: stable id, official URL, title, type, publication date,
      hash. Full document text is never stored — large or restricted documents
      become a manifest row under disclosures/manifests/.

  fixture_financials:
    kind: fixture
    enabled: true
    operator: "This repository (development fixture)"
    data_types: [financial_facts, financial_statements, restatements]
    fixture_path: "pipeline/goh_dip_tong/tests/fixtures/financials/facts-sample.json"
    authoritative: false
    rights_status: PUBLIC_DERIVED_OUTPUT_APPROVED
    rights:
      store_raw: false
      commit_to_repo: true
      public_display: true
      redistribute: false
    attribution: "Development fixture — synthetic XBRL-shaped facts."
    update_cadence: manual
    notes: >
      Shaped like an XBRL fact table (concept id, context period, unit, decimals,
      sign) so the live XBRL adapter can be swapped in without touching the
      parser contract. Includes one deliberate restatement so revision handling
      is covered end to end.

  fixture_macro:
    kind: fixture
    enabled: true
    operator: "This repository (development fixture)"
    data_types: [macro_series]
    fixture_path: "pipeline/goh_dip_tong/tests/fixtures/macro/series-sample.json"
    authoritative: false
    rights_status: PUBLIC_METADATA_ONLY
    rights:
      store_raw: false
      commit_to_repo: true
      public_display: true
      redistribute: false
    attribution: "Development fixture — synthetic macro series."
    update_cadence: manual
    notes: >
      Carries observation period, publication date and retrieval timestamp as
      three separate fields, plus a release vintage, so revision handling is
      exercised.

  # ---------------------------------------------------------------------------
  # LIVE PROVIDERS — registered, structurally complete, HARD DISABLED.
  #
  # CONNECTIVITY, as verified from GitHub Actions run 30537966831 (2026-07-30):
  #   ACCESS_CONTROLLED (5)  idx_index_constituents, idx_market_prices,
  #                          idx_disclosures, idx_financials, bps
  #                          — reached, then refused by the operator with HTTP 403
  #   REACHABLE_UNVALIDATED (2)  bank_indonesia, ojk
  #                          — HTTP 302 to a human-facing landing page
  #
  # `connectivity_status` and `blocked_reason` describe the NETWORK only. They
  # say nothing about permission, and a null blocked_reason is not clearance.
  # EVERY provider here is still disabled because its usage rights are
  # unreviewed — a separate lock that no connectivity result can release.
  #
  # The rights gate additionally refuses to run any provider whose rights_status
  # is MANUAL_REVIEW_REQUIRED even if someone flips `enabled`, so enabling one
  # genuinely requires releasing two independent locks.
  # ---------------------------------------------------------------------------

  idx_index_constituents:
    kind: http
    enabled: false
    operator: "PT Bursa Efek Indonesia (IDX)"
    official_url: "https://www.idx.co.id/en/market-data/stock-market-data/index-constituents/"
    data_types: [index_membership, company_identity, sector_classification]
    access_method: http_public_page
    authentication: none
    authoritative: true
    rights_status: MANUAL_REVIEW_REQUIRED
    rights:
      store_raw: false
      commit_to_repo: false
      public_display: false
      redistribute: false
    attribution: "Source: PT Bursa Efek Indonesia (IDX)"
    update_cadence: "semi-annual index review (Jan/Feb and Jul/Aug), plus ad-hoc"
    fallback: fixture_idx30_registry
    # Connectivity verified from GitHub Actions run 30537966831 (2026-07-30).
    # The runner reached the host and the OPERATOR refused. This is a decision
    # by the source, not an environment limitation, and it must not be worked
    # around — see docs/goh-dip-tong/DATA_RIGHTS.md.
    connectivity_status: ACCESS_CONTROLLED
    http_status: 403
    blocked_reason: "Source returned HTTP 403 to GitHub Actions runner"
    connectivity_verified_at: "2026-07-30"
    connectivity_run_id: "30537966831"
    notes: >
      Network egress is no longer the obstacle — a GitHub Actions runner reaches
      idx.co.id and receives HTTP 403. IDX is declining automated access from
      that address range. Enabling therefore requires an operator-level
      resolution (an official data agreement, a licensed vendor, or a documented
      permitted-use path), plus a reviewed record of IDX terms and a dated
      SOURCE_REGISTER row. Do not scrape around the 403, any rate limit or any
      anti-bot measure.

  idx_market_prices:
    kind: http
    enabled: false
    operator: "PT Bursa Efek Indonesia (IDX)"
    official_url: "https://www.idx.co.id/en/market-data/trading-summary/stock-summary/"
    data_types: [market_prices_daily, corporate_actions]
    access_method: http_public_page
    authentication: none
    authoritative: true
    rights_status: MANUAL_REVIEW_REQUIRED
    rights:
      store_raw: false
      commit_to_repo: false
      public_display: false
      redistribute: false
    attribution: "Source: PT Bursa Efek Indonesia (IDX)"
    update_cadence: "each trading day after close (16:00 WIB)"
    fallback: fixture_market_prices
    # Connectivity verified from GitHub Actions run 30537966831 (2026-07-30).
    # The runner reached the host and the OPERATOR refused. This is a decision
    # by the source, not an environment limitation, and it must not be worked
    # around — see docs/goh-dip-tong/DATA_RIGHTS.md.
    connectivity_status: ACCESS_CONTROLLED
    http_status: 403
    blocked_reason: "Source returned HTTP 403 to GitHub Actions runner"
    connectivity_verified_at: "2026-07-30"
    connectivity_run_id: "30537966831"
    notes: >
      Market-price redistribution is the highest-risk right in this project and
      is explicitly out of scope until documented. The endpoint now answers 403
      to automated requests, so access and rights are both unresolved. Even once
      both are settled, this provider must first run at PRIVATE_RESEARCH_ONLY.

  idx_disclosures:
    kind: http
    enabled: false
    operator: "PT Bursa Efek Indonesia (IDX)"
    official_url: "https://www.idx.co.id/en/listed-companies/company-announcement/"
    data_types: [disclosure_metadata, events]
    access_method: http_public_page
    authentication: none
    authoritative: true
    rights_status: MANUAL_REVIEW_REQUIRED
    rights:
      store_raw: false
      commit_to_repo: false
      public_display: false
      redistribute: false
    attribution: "Source: PT Bursa Efek Indonesia (IDX)"
    update_cadence: intraday
    fallback: fixture_disclosures
    # Connectivity verified from GitHub Actions run 30537966831 (2026-07-30).
    # The runner reached the host and the OPERATOR refused. This is a decision
    # by the source, not an environment limitation, and it must not be worked
    # around — see docs/goh-dip-tong/DATA_RIGHTS.md.
    connectivity_status: ACCESS_CONTROLLED
    http_status: 403
    blocked_reason: "Source returned HTTP 403 to GitHub Actions runner"
    connectivity_verified_at: "2026-07-30"
    connectivity_run_id: "30537966831"
    notes: >
      Metadata-only by design. Announcement PDFs must never be committed; they
      become a manifest row (official URL + hash + retrieval outcome). The
      endpoint currently answers 403 to automated requests.

  idx_financials:
    kind: http
    enabled: false
    operator: "PT Bursa Efek Indonesia (IDX)"
    official_url: "https://www.idx.co.id/en/listed-companies/financial-statements-and-annual-report/"
    data_types: [financial_facts, financial_statements, restatements]
    access_method: http_public_page
    authentication: none
    authoritative: true
    rights_status: MANUAL_REVIEW_REQUIRED
    rights:
      store_raw: false
      commit_to_repo: false
      public_display: false
      redistribute: false
    attribution: "Source: PT Bursa Efek Indonesia (IDX); issuer filings"
    update_cadence: "quarterly filing windows, plus ad-hoc restatements"
    fallback: fixture_financials
    # Connectivity verified from GitHub Actions run 30537966831 (2026-07-30).
    # The runner reached the host and the OPERATOR refused. This is a decision
    # by the source, not an environment limitation, and it must not be worked
    # around — see docs/goh-dip-tong/DATA_RIGHTS.md.
    connectivity_status: ACCESS_CONTROLLED
    http_status: 403
    blocked_reason: "Source returned HTTP 403 to GitHub Actions runner"
    connectivity_verified_at: "2026-07-30"
    connectivity_run_id: "30537966831"
    notes: >
      XBRL instance documents are the intended input. PDF and Excel filings need
      separate adapters with stronger validation and must never be committed;
      they become manifest rows. The endpoint currently answers 403 to automated
      requests, so no response has yet been captured to write a parser against.

  bank_indonesia:
    kind: http
    enabled: false
    operator: "Bank Indonesia"
    official_url: "https://www.bi.go.id/en/statistik/"
    data_types: [macro_series]
    access_method: http_public_page
    authentication: none
    authoritative: true
    rights_status: MANUAL_REVIEW_REQUIRED
    rights: { store_raw: false, commit_to_repo: false, public_display: false, redistribute: false }
    attribution: "Source: Bank Indonesia"
    update_cadence: monthly
    fallback: fixture_macro
    # Connectivity verified from GitHub Actions run 30537966831 (2026-07-30).
    # Reachable is NOT permission. This provider stays disabled because its
    # usage rights are unreviewed — not because the network refused us, and a
    # null blocked_reason must never be read as clearance to enable it.
    connectivity_status: REACHABLE_UNVALIDATED
    http_status: 302
    blocked_reason: null
    connectivity_verified_at: "2026-07-30"
    connectivity_run_id: "30537966831"

