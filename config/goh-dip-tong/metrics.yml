# Goh Dip Tong — canonical metric definitions
#
# One definition per metric, shared by collectors, the Stage 2 engine and the
# Stage 3 UI. A metric that is not defined here must not be published.
#
# `basis` is the disclosure class the public product must separate (spec's
# shared rules): REPORTED, RESTATED, NORMALIZED, DERIVED, FORECAST,
# MARKET_IMPLIED. The UI is required to label these differently — a derived
# margin must never look like a reported one.
#
# `sign_convention` documents the stored sign. Stage 1 stores cash outflows as
# negative and never flips a sign silently during normalization.

schemaVersion: "1.0.0"

units:
  IDR: { kind: currency, label: "Indonesian rupiah" }
  USD: { kind: currency, label: "United States dollar" }
  SHARES: { kind: count, label: "Shares" }
  RATIO: { kind: ratio, label: "Ratio (1.0 = 100%)" }
  PERCENT: { kind: ratio, label: "Percent (100 = 100%)" }
  DAYS: { kind: duration, label: "Days" }
  INDEX_POINTS: { kind: index, label: "Index points" }

# Reporting scales seen in Indonesian filings. Values are normalized to base
# units on ingest; the original scale is retained on the record.
scales:
  UNITS: 1
  THOUSANDS: 1000
  MILLIONS: 1000000
  BILLIONS: 1000000000
  TRILLIONS: 1000000000000

period_types:
  FY: "Full financial year"
  Q1: "First quarter, three months"
  Q2: "Second quarter, three months standalone"
  Q3: "Third quarter, three months standalone"
  Q4: "Fourth quarter, three months standalone"
  H1: "First half, six months"
  H2: "Second half, six months"
  YTD_Q1: "Year to date through Q1"
  YTD_Q2: "Year to date through Q2"
  YTD_Q3: "Year to date through Q3"
  TTM: "Trailing twelve months"
  POINT_IN_TIME: "Balance-sheet instant"

metrics:

  # --- Income statement, as reported -----------------------------------------
  revenue:
    label: "Revenue"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive"
    concepts: ["Revenue", "SalesAndRevenue", "RevenueFromContractsWithCustomers"]
    notes: "Banks report interest income separately; see interest_income."
  cost_of_revenue:
    label: "Cost of revenue"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive magnitude; subtracted by the engine, not stored negative"
    concepts: ["CostOfSales", "CostOfRevenue"]
  gross_profit:
    label: "Gross profit"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "signed"
    concepts: ["GrossProfit"]
  operating_profit:
    label: "Operating profit"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "signed"
    concepts: ["ProfitFromOperation", "OperatingIncomeLoss"]
  net_profit:
    label: "Profit for the period"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "signed"
    concepts: ["ProfitLoss"]
  net_profit_attributable_to_parent:
    label: "Profit attributable to owners of the parent"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "signed"
    concepts: ["ProfitLossAttributableToParentEntity"]
    notes: "This, not ProfitLoss, is the EPS numerator. Confusing the two is a known failure mode."
  interest_income:
    label: "Interest income"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive"
    concepts: ["InterestIncome", "RevenueFromInterest"]
    applies_to_model_families: [BANK]
  interest_expense:
    label: "Interest expense"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive magnitude"
    concepts: ["InterestExpense", "FinanceCosts"]

  # --- Balance sheet, as reported --------------------------------------------
  total_assets:
    label: "Total assets"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["Assets"]
  total_liabilities:
    label: "Total liabilities"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["Liabilities"]
  total_equity:
    label: "Total equity"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "signed"
    concepts: ["Equity"]
  equity_attributable_to_parent:
    label: "Equity attributable to owners of the parent"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "signed"
    concepts: ["EquityAttributableToParentEntity"]
  cash_and_equivalents:
    label: "Cash and cash equivalents"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["CashAndCashEquivalents"]
  interest_bearing_debt:
    label: "Interest-bearing debt"
    statement: BALANCE_SHEET
    basis: DERIVED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    derived_from: [short_term_borrowings, long_term_borrowings, lease_liabilities]
    notes: "Derived, not reported. Must be labelled DERIVED in the UI."
  short_term_borrowings:
    label: "Short-term borrowings"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["ShortTermBorrowings"]
  long_term_borrowings:
    label: "Long-term borrowings"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["LongTermBorrowings"]
  lease_liabilities:
    label: "Lease liabilities"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["LeaseLiabilities"]

  # --- Bank drivers, as reported ---------------------------------------------
  #
  # Added in Stage 2 for the BANK model family (spec section 2.5). These are
  # REPORTED inputs the engine reads; the ratios built from them live in the
  # derived section below. None of them is collected by any enabled provider
  # today — every one is absent from the fixture data, which is exactly why the
  # bank valuation refuses. Defining them here does not create them.
  earning_assets:
    label: "Earning assets"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["EarningAssets", "InterestEarningAssets"]
    applies_to_model_families: [BANK]
    notes: "The NIM denominator. Not the same as total assets."
  loans:
    label: "Gross loans"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["LoansReceivable", "LoansAndAdvancesToCustomers"]
    applies_to_model_families: [BANK]
    notes: "Gross of allowance. Netting it against the allowance here would make coverage uncomputable."
  deposits:
    label: "Customer deposits"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["DepositsFromCustomers", "CustomerDeposits"]
    applies_to_model_families: [BANK]
  casa_deposits:
    label: "Current account and savings account deposits"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["CurrentAccountsAndSavingsDeposits"]
    applies_to_model_families: [BANK]
    notes: "The low-cost funding subset of deposits. Drives funding cost."
  fee_income:
    label: "Fee and commission income"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive"
    concepts: ["FeeAndCommissionIncome"]
    applies_to_model_families: [BANK]
  operating_expense:
    label: "Operating expense"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive magnitude; subtracted by the engine, not stored negative"
    concepts: ["OperatingExpenses", "GeneralAndAdministrativeExpense"]
  provision_expense:
    label: "Impairment charge on loans"
    statement: INCOME_STATEMENT
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "positive magnitude"
    concepts: ["ImpairmentLossOnFinancialAssets", "ProvisionForImpairmentLosses"]
    applies_to_model_families: [BANK]
    notes: "The period charge, not the balance-sheet allowance. Confusing the two overstates credit cost by an order of magnitude."
  non_performing_loans:
    label: "Non-performing loans"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["NonPerformingLoans"]
    applies_to_model_families: [BANK]
    notes: "Stored as an amount, not a ratio. The ratio is derived, so its denominator stays visible."
  loan_loss_allowance:
    label: "Allowance for loan losses"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive magnitude"
    concepts: ["AllowanceForImpairmentLosses"]
    applies_to_model_families: [BANK]
  tier1_capital:
    label: "Tier 1 capital"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["Tier1Capital"]
    applies_to_model_families: [BANK]
  risk_weighted_assets:
    label: "Risk-weighted assets"
    statement: BALANCE_SHEET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    concepts: ["RiskWeightedAssets"]
    applies_to_model_families: [BANK]

  # --- Cash flow, as reported ------------------------------------------------
  cfo:
    label: "Net cash from operating activities"
    statement: CASH_FLOW
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "signed; outflow negative"
    concepts: ["NetCashFlowsFromUsedInOperatingActivities"]
  capex:
    label: "Purchase of fixed assets"
    statement: CASH_FLOW
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "negative (outflow) as reported; the engine takes the magnitude"
    concepts: ["PaymentsToAcquirePropertyPlantAndEquipment"]
  dividends_paid:
    label: "Dividends paid"
    statement: CASH_FLOW
    basis: REPORTED
    unit_kind: currency
    period_kind: duration
    sign_convention: "negative (outflow)"
    concepts: ["PaymentsOfDividends"]

  # --- Capital structure -----------------------------------------------------
  shares_outstanding:
    label: "Shares outstanding"
    statement: CAPITAL_STRUCTURE
    basis: REPORTED
    unit: SHARES
    period_kind: instant
    sign_convention: "positive"
    concepts: ["NumberOfSharesOutstanding"]
  treasury_shares:
    label: "Treasury shares"
    statement: CAPITAL_STRUCTURE
    basis: REPORTED
    unit: SHARES
    period_kind: instant
    sign_convention: "positive magnitude"
    concepts: ["TreasuryShares"]

  # --- Market ----------------------------------------------------------------
  close_price:
    label: "Closing price"
    statement: MARKET
    basis: REPORTED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    rights_note: "Requires a market-data provider with documented rights. PRIVATE_RESEARCH_ONLY until then."
  adjusted_close_price:
    label: "Adjusted closing price"
    statement: MARKET
    basis: NORMALIZED
    unit_kind: currency
    period_kind: instant
    sign_convention: "positive"
    rights_note: >
      Only publishable when BOTH the adjustment methodology and the provider's
      rights are documented. Spec section 1.5 forbids storing this otherwise.

  # --- Derived (engine owns the maths; Stage 1 only reserves the names) ------
  ttm_revenue:
    label: "Revenue, trailing twelve months"
    basis: DERIVED
    unit_kind: currency
    period_kind: duration
    derived_from: [revenue]
    notes: "Requires four consecutive standalone quarters; otherwise null with reason INSUFFICIENT_PERIODS."
  net_debt:
    label: "Net debt"
    basis: DERIVED
    unit_kind: currency
    period_kind: instant
    derived_from: [interest_bearing_debt, cash_and_equivalents]
    not_applicable_to_model_families: [BANK, INSURANCE]
    notes: "Meaningless for banks. The engine must return null with reason NOT_APPLICABLE_TO_MODEL, not 0."

  # --- Derived, universal ----------------------------------------------------
  eps:
    label: "Earnings per share"
    basis: DERIVED
    unit_kind: currency
    period_kind: duration
    derived_from: [net_profit_attributable_to_parent, shares_outstanding]
    notes: "Numerator is profit attributable to the PARENT, not ProfitLoss. See net_profit_attributable_to_parent."
  bvps:
    label: "Book value per share"
    basis: DERIVED
    unit_kind: currency
    period_kind: instant
    derived_from: [equity_attributable_to_parent, shares_outstanding]
    notes: "Parent equity over the share count. Using total_equity here would credit minorities to the parent's book."
  roe:
    label: "Return on equity"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [net_profit_attributable_to_parent, equity_attributable_to_parent]
    notes: "Computed on average parent equity across the period, not the closing balance."
  roa:
    label: "Return on assets"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [net_profit, total_assets]
  payout_ratio:
    label: "Dividend payout ratio"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [dividends_paid, net_profit_attributable_to_parent]
  sustainable_growth:
    label: "Sustainable growth rate"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [roe, payout_ratio]
    notes: "g = ROE x (1 - payout). Feeds terminal value, so the r > g guard depends on it."

  # --- Derived, bank ---------------------------------------------------------
  net_interest_income:
    label: "Net interest income"
    basis: DERIVED
    unit_kind: currency
    period_kind: duration
    derived_from: [interest_income, interest_expense]
    applies_to_model_families: [BANK]
  nim:
    label: "Net interest margin"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [net_interest_income, earning_assets]
    applies_to_model_families: [BANK]
    notes: "Over average earning assets. Over total assets it is not NIM and is not comparable."
  cost_of_credit:
    label: "Cost of credit"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [provision_expense, loans]
    applies_to_model_families: [BANK]
  npl_ratio_gross:
    label: "Gross NPL ratio"
    basis: DERIVED
    unit: RATIO
    period_kind: instant
    derived_from: [non_performing_loans, loans]
    applies_to_model_families: [BANK]
  npl_coverage_ratio:
    label: "NPL coverage ratio"
    basis: DERIVED
    unit: RATIO
    period_kind: instant
    derived_from: [loan_loss_allowance, non_performing_loans]
    applies_to_model_families: [BANK]
  casa_ratio:
    label: "CASA ratio"
    basis: DERIVED
    unit: RATIO
    period_kind: instant
    derived_from: [casa_deposits, deposits]
    applies_to_model_families: [BANK]
  capital_adequacy_ratio:
    label: "Tier 1 capital adequacy ratio"
    basis: DERIVED
    unit: RATIO
    period_kind: instant
    derived_from: [tier1_capital, risk_weighted_assets]
    applies_to_model_families: [BANK]
  cost_to_income_ratio:
    label: "Cost-to-income ratio"
    basis: DERIVED
    unit: RATIO
    period_kind: duration
    derived_from: [operating_expense, net_interest_income, fee_income]
    applies_to_model_families: [BANK]

# Reasons a metric may be null. A missing value ALWAYS carries one of these.
# Section 1.1: extraction failure must never become zero.
missing_reasons:
  NOT_REPORTED: "The issuer did not report this concept for this period."
  NOT_APPLICABLE_TO_MODEL: "Metric is not meaningful for this model family."
  EXTRACTION_FAILED: "The document was retrieved but the value could not be parsed."
  SOURCE_UNAVAILABLE: "The source could not be reached or is disabled."
  RIGHTS_WITHHELD: "Collected but withheld because rights do not permit this use."
  INSUFFICIENT_PERIODS: "A derived metric lacked the required input periods."
  UNDEFINED_DENOMINATOR: >
    A ratio's denominator was zero, missing, or of the wrong sign, so the ratio
    is undefined. Added in Stage 2. This exists so a division can fail visibly
    instead of returning inf, nan, or a caught-and-swallowed zero — a concealed
    divide-by-zero is the derived-metric equivalent of missing becoming zero.
  PENDING_REVIEW: "Value exists but failed validation and was not promoted."
  SUPERSEDED: "Value was replaced by a restatement; see the successor revision."
