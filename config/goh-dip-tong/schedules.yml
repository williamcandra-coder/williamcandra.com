# Goh Dip Tong — scheduler contract
#
# This file is the single source of truth for every workflow trigger. The
# workflow YAML under .github/workflows/ must agree with it exactly;
# tests/test_workflows.py asserts that, so a cron edited in only one of the two
# places fails CI rather than drifting silently.
#
# All cron expressions are UTC. Jakarta (WIB) is UTC+7 with no DST.
# IDX regular trading runs roughly 09:00–16:00 WIB.
#
# SAFETY GATE
# Every scheduled job is additionally guarded in YAML by
#     if: github.event_name != 'schedule' || vars.GDT_SCHEDULES_ENABLED == 'true'
# The repository variable GDT_SCHEDULES_ENABLED is unset by default, so no
# schedule does any work until it is deliberately set to the string 'true'.
# Manual workflow_dispatch is never gated.

schemaVersion: "1.0.0"
timezone_note: "cron values are UTC; WIB = UTC+7"
schedules_enabled_variable: "GDT_SCHEDULES_ENABLED"

# Write mode.
#
# `validate_only` collects and validates but promotes nothing. `commit` promotes
# validated output into the working tree — it does NOT mean "push to the default
# branch". No workflow can do that: every generated change goes to a
# gdt/auto/* branch and a pull request, and merge is manual (spec section 1.9).
#
# A scheduled run uses `commit`, because a schedule that only ever validates
# never actually collects anything. The human-in-the-loop requirement is met by
# the pull request, not by crippling the schedule.
#
# A manual dispatch defaults to `validate_only`, so poking a workflow by hand is
# a safe way to see what it would do.
scheduled_write_mode: commit
dispatch_default_write_mode: validate_only

workflows:

  gdt-registry-update:
    file: .github/workflows/gdt-registry-update.yml
    purpose: "Discover IDX30 membership, diff against current config, append history."
    dispatch: true
    cron: "30 22 * * 1"
    local_time: "Tue 05:30 WIB"
    rationale: "Runs before the Jakarta trading week so a membership change is reviewable on Tuesday morning."
    write_mode_on_schedule: commit
    commit_policy: pull_request
    branch_prefix: gdt/auto/registry

  gdt-historical-backfill:
    file: .github/workflows/gdt-historical-backfill.yml
    purpose: "Manually triggered historical backfill across scope/ticker/data type."
    dispatch: true
    cron: null
    local_time: null
    rationale: "Backfill is expensive and correction-sensitive; spec section 1.7 requires manual triggering only."
    write_mode_on_schedule: commit
    commit_policy: pull_request
    branch_prefix: gdt/auto/backfill

  gdt-daily-update:
    file: .github/workflows/gdt-daily-update.yml
    purpose: "Collect permitted market data and fast-changing metadata for active constituents."
    dispatch: true
    cron: "30 11 * * 1-5"
    local_time: "Mon-Fri 18:30 WIB"
    rationale: "2.5 hours after the 16:00 WIB close, leaving room for late exchange corrections."
    write_mode_on_schedule: commit
    commit_policy: pull_request
    branch_prefix: gdt/auto/daily

  gdt-disclosure-watch:
    file: .github/workflows/gdt-disclosure-watch.yml
    purpose: "Discover new disclosure metadata and flag new financial filings."
    dispatch: true
    cron: "17 2,6,10,14 * * *"
    local_time: "09:17 / 13:17 / 17:17 / 21:17 WIB"
    rationale: "Four intraday sweeps around the trading day. Off-the-hour minute avoids GitHub's cron congestion."
    write_mode_on_schedule: commit
    commit_policy: pull_request
    branch_prefix: gdt/auto/disclosures

  gdt-financial-update:
    file: .github/workflows/gdt-financial-update.yml
    purpose: "Parse newly flagged filings into normalized facts; detect restatements."
    dispatch: true
    cron: "45 12 * * *"
    local_time: "19:45 WIB daily"
    rationale: "Runs after the evening disclosure sweep so same-day filings are picked up."
    write_mode_on_schedule: commit
    commit_policy: pull_request
    branch_prefix: gdt/auto/financials

  gdt-macro-update:
    file: .github/workflows/gdt-macro-update.yml
    purpose: "Collect registered OJK / Bank Indonesia / BPS series with release vintage."
    dispatch: true
    cron: "40 23 * * 0"
    local_time: "Mon 06:40 WIB"
    rationale: "Macro series are monthly at best; a weekly check is ample and cheap."
    write_mode_on_schedule: commit
    commit_policy: pull_request
    branch_prefix: gdt/auto/macro

  gdt-source-connectivity-smoke:
    file: .github/workflows/gdt-source-connectivity-smoke.yml
    purpose: >
      Diagnostic probe of configured official source URLs. Records reachability
      metadata only; enables nothing and collects no data.
    dispatch: true
    cron: null
    local_time: null
    rationale: >
      Manual only, deliberately. Probing third-party hosts unattended is not
      something to schedule, and the result never justifies an automated action —
      the best possible outcome is REACHABLE_UNVALIDATED.
    write_mode_on_schedule: null
    commit_policy: never
    branch_prefix: null

  gdt-bi-discovery:
    file: .github/workflows/gdt-bi-discovery.yml
    purpose: >
      Phase A of the Bank Indonesia vertical slice. Records what documented
      official BI URLs actually return — final URL after redirects, status,
      content type, size, cache validators. Retains no response body, enables
      no provider and implements no parser.
    dispatch: true
    cron: null
    local_time: null
    rationale: >
      Manual only, and there is no case for ever scheduling it. This is a
      one-off investigation whose output is evidence for a human rights review,
      not an input to any automated decision. bank_indonesia stays
      enabled: false / MANUAL_REVIEW_REQUIRED whatever the probe returns.
    write_mode_on_schedule: null
    commit_policy: never
    branch_prefix: null

  gdt-data-quality:
    file: .github/workflows/gdt-data-quality.yml
    purpose: "Schema validation, quality gates, repository guard and the Stage 1 test suite."
    dispatch: true
    cron: "5 6 * * *"
    local_time: "13:05 WIB daily"
    rationale: "Independent daily audit of committed data, plus it runs on every pull request."
    also_triggers_on: [pull_request]
    write_mode_on_schedule: null
    commit_policy: never
    branch_prefix: null
